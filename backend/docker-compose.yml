services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web3-app
    env_file:
      - .env
    ports:
      - '3000:3000'
    volumes:
      - /usr/src/app/dist
      - /usr/src/app/node_modules
    
  db:
    image: postgres:alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5450:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: